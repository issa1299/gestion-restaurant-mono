{% load static %}

<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="{% url 'manifest' %}?v={{ parametre.version_manifest }}">
<link rel="apple-touch-icon" href="{% url 'pwa_icon' 192 %}">

<title>
{% block title %}
RestaurantPro
{% endblock %}
</title>


<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
    body {
        /* Encoche iPhone en mode app installee (mode standalone) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }
</style>


</head>


<body class="bg-slate-100">


{% block content %}

{% endblock %}


<script>
// PWA : rend l'ecran de connexion installable comme une vraie app
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register("{% url 'service_worker' %}")
            .catch(function (err) { console.warn('Service worker non enregistre:', err); });
    });
}
</script>

</body>

</html>
