<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>Hors ligne — RestaurantPro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f8fafc;
    color: #1e293b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    text-align: center;
  }
  .carte {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  .icone {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 20px; background: #fff7ed; color: #f97316;
    font-size: 36px; line-height: 72px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.6; color: #64748b; margin-bottom: 20px; }
  button {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #f97316; color: #fff; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; margin-bottom: 10px;
  }
  button.secondary { background: #e2e8f0; color: #334155; }
  button:active { opacity: .9; }
  small { display: block; margin-top: 8px; font-size: 12px; color: #94a3b8; }
  .status { font-size: 12px; color: #64748b; margin-bottom: 16px; }
  .status.online { color: #059669; font-weight: 700; }
</style>
</head>
<body>
<div class="carte">
  <div class="icone">⚡</div>
  <h1>Pas de connexion</h1>
  <p id="msg">Votre appareil est hors ligne. Les pages déjà ouvertes (livraisons, caisse…) peuvent encore s’afficher. Les actions seront envoyées au retour du réseau.</p>
  <p class="status" id="net-status">Statut : hors ligne</p>
  <button type="button" onclick="tryReload()">Réessayer</button>
  <button type="button" class="secondary" onclick="goHome()">Retour accueil</button>
  <small>RestaurantPro — mode hors-ligne</small>
</div>
<script>
function tryReload() {
  if (navigator.onLine) location.reload();
  else {
    document.getElementById('msg').textContent = 'Toujours hors ligne. Vérifiez le Wi‑Fi ou les données mobiles.';
  }
}
function goHome() {
  location.href = '/livraisons/';
}
function updateStatus() {
  var el = document.getElementById('net-status');
  if (navigator.onLine) {
    el.textContent = 'Connexion rétablie — rechargement…';
    el.className = 'status online';
    setTimeout(function () { location.reload(); }, 600);
  } else {
    el.textContent = 'Statut : hors ligne';
    el.className = 'status';
  }
}
window.addEventListener('online', updateStatus);
updateStatus();
</script>
</body>
</html>
