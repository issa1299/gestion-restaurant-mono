{% extends "site/base_site.html" %}

{% block title %}Page introuvable - {{ parametre.nom|default:"Restaurant" }}{% endblock %}

{% block content %}
<section class="py-20 sm:py-28">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <div class="anim-fade-up anim-visible">
            <p class="text-8xl sm:text-9xl font-extrabold text-orange-500">404</p>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-4">Oups, page introuvable</h1>
            <p class="text-slate-500 mt-3">La page que vous cherchez n'existe pas ou a été déplacée.</p>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">
                <a href="{% url 'restaurant:accueil' %}"
                   class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-7 py-3.5 rounded-full transition flex items-center justify-center gap-2 shadow-xl hover:scale-105 active:scale-95">
                    <i class="fas fa-home"></i> Retour à l'accueil
                </a>
                <a href="{% url 'menu:accueil' %}"
                   class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-7 py-3.5 rounded-full transition flex items-center justify-center gap-2 hover:scale-105 active:scale-95">
                    <i class="fas fa-book-open"></i> Voir le menu
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
