<!-- Modal Suppression -->

<div
    id="deleteModal"
    style="display:none"
    class="fixed inset-0 bg-black/60 items-center justify-center z-50">

    <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

        <!-- Header -->

        <div class="bg-red-600 text-white p-5 text-center">

            <i class="fas fa-trash-alt text-5xl mb-3"></i>

            <h2 class="text-2xl font-bold">

                Confirmation

            </h2>

        </div>

        <!-- Body -->

        <div class="p-8 text-center">

            <p class="text-gray-600">

                Voulez-vous vraiment supprimer

            </p>

            <h3
                id="deleteItemName"
                class="text-xl font-bold text-red-600 mt-3">

            </h3>

            <p class="text-sm text-gray-400 mt-4">

                Cette action est irréversible.

            </p>

        </div>

        <!-- Footer -->

        <form
            method="POST"
            id="deleteForm"
            action="#"
            class="flex justify-center gap-4 p-6 bg-gray-100">
            {% csrf_token %}
            <button
                type="button"
                onclick="closeDeleteModal()"
                class="px-6 py-3 rounded-xl bg-gray-400 text-white hover:bg-gray-500">

                <i class="fas fa-times"></i>

                Annuler

            </button>

            <button
                type="submit"
                class="px-6 py-3 rounded-xl bg-red-600 text-white hover:bg-red-700">

                <i class="fas fa-trash"></i>

                Supprimer

            </button>

        </form>

    </div>

</div>

<script>
function openDeleteModal(name, url) {
  document.getElementById("deleteItemName").innerHTML = name;
  document.getElementById("deleteForm").action = url;
  document.getElementById("deleteModal").style.display = "flex";
}
function closeDeleteModal() {
  document.getElementById("deleteModal").style.display = "none";
}
window.onclick = function (e) {
  const modal = document.getElementById("deleteModal");
  if (e.target === modal) { closeDeleteModal(); }
};
</script>
