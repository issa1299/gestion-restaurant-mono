<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>Hors ligne</title>
<style>
    /* Page 100% autonome : aucune ressource externe, doit s'afficher hors ligne. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
    }
    .carte {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
    }
    .icone {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: #fff7ed;
        color: #f97316;
        font-size: 36px;
        line-height: 72px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #64748b; margin-bottom: 24px; }
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #f97316;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
    }
    button:hover { background: #ea580c; }
    small { display: block; margin-top: 16px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="carte">
    <div class="icone">&#9888;</div>
    <h1>Pas de connexion</h1>
    <p>Votre appareil est hors ligne. Vérifiez votre réseau puis réessayez : vos données restent enregistrées dans l'application.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>Les pages déjà consultées peuvent rester accessibles.</small>
</div>
</body>
</html>
